<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Fav Playlist</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 40%, #415a77 70%, #1e1b4b 100%);
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
            padding: 40px 20px;
        }

        /* Canvas Bintang Jatuh & Sparkle */
        #canvas-stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Title Style */
        .title-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title-header h1 {
            font-family: 'Pacifico', cursive;
            font-size: 4rem;
            background: linear-gradient(45deg, #a5b4fc, #c084fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 25px rgba(192, 132, 252, 0.3);
            letter-spacing: 2px;
        }

        /* SVG Decorative Background Lines */
        .connecting-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .connecting-lines path {
            stroke: rgba(255, 255, 255, 0.25);
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 6;
            animation: dash 30s linear infinite;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: -1000;
            }
        }

        /* Layout Grid / Flow */
        .playlist-flow {
            display: flex;
            flex-direction: column;
            gap: 24px;
            position: relative;
        }

        .flow-row {
            display: flex;
            align-items: center;
            width: 100%;
        }

        .flow-row.left { justify-content: flex-start; }
        .flow-row.right { justify-content: flex-end; }
        .flow-row.center { justify-content: center; }

        /* Song Card / Glassmorphism */
        .song-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            max-width: 440px;
            width: 100%;
        }

        .song-card:hover {
            transform: translateY(-5px) scale(1.02);
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(192, 132, 252, 0.5);
            box-shadow: 0 12px 40px 0 rgba(192, 132, 252, 0.25);
        }

        /* Sub-tag Name */
        .user-tag {
            position: absolute;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.85rem;
            color: #cbd5e1;
            background: rgba(15, 23, 42, 0.6);
            padding: 2px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .tag-top-right { top: -12px; right: 20px; }
        .tag-left { left: -45px; transform: rotate(-90deg); }
        .tag-bottom { bottom: -12px; left: 30px; }

        /* Album Cover */
        .album-art {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.3);
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Song Info */
        .song-info {
            flex-grow: 1;
            overflow: hidden;
        }

        .song-title {
            font-weight: 600;
            font-size: 1.05rem;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* Audio Controls */
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
        }

        .btn-icon {
            background: none;
            border: none;
            color: #cbd5e1;
            font-size: 0.95rem;
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
        }

        .btn-icon:hover {
            color: #f472b6;
            transform: scale(1.15);
        }

        .btn-icon.active {
            color: #ec4899;
        }

        .btn-play {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.4);
        }

        .btn-play:hover {
            transform: scale(1.1);
            color: #fff;
        }

        /* Note Bubble */
        .note-bubble {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            border: 1.5px dashed rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            padding: 20px 30px;
            text-align: center;
            max-width: 380px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.2rem;
            color: #e2e8f0;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .note-bubble i {
            color: #f472b6;
        }

        /* Illustrations / Decorative SVGs */
        .doodle-headphone {
            width: 140px;
            opacity: 0.85;
            filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.4));
        }

        .doodle-mic {
            width: 90px;
            opacity: 0.85;
            filter: drop-shadow(0 0 10px rgba(236, 72, 153, 0.4));
        }

        /* Responsive */
        @media (max-width: 768px) {
            .title-header h1 { font-size: 2.8rem; }
            .flow-row { justify-content: center !important; }
            .song-card { max-width: 100%; }
            .user-tag.tag-left { left: 10px; top: -12px; transform: none; }
            .bottom-decorations { flex-direction: column; align-items: center; gap: 20px; }
        }

        .bottom-decorations {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 40px;
            padding: 0 20px;
        }
    </style>
</head>

    <!-- Script Animasi Bintang Jatuh -->
    <script>
        const canvas = document.getElementById('canvas-stars');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Background Static Stars
        const staticStars = [];
        for (let i = 0; i < 120; i++) {
            staticStars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 2,
                alpha: Math.random(),
                speed: 0.01 + Math.random() * 0.02
            });
        }

        // Shooting Stars (Bintang Jatuh)
        const shootingStars = [];
        function createShootingStar() {
            shootingStars.push({
                x: Math.random() * width,
                y: Math.random() * (height / 2),
                length: 80 + Math.random() * 60,
                speed: 8 + Math.random() * 6,
                angle: Math.PI / 4, // 45 derajat
                alpha: 1
            });
        }

        // Trigger shooting star periodically
        setInterval(createShootingStar, 2500);

        function draw() {
            ctx.clearRect(0, 0, width, height);

            // Draw Static Stars with Twinkle effect
            staticStars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
                
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.alpha)})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Shooting Stars
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const star = shootingStars[i];
                
                const tailX = star.x - Math.cos(star.angle) * star.length;
                const tailY = star.y - Math.sin(star.angle) * star.length;

                const gradient = ctx.createLinearGradient(star.x, star.y, tailX, tailY);
                gradient.addColorStop(0, `rgba(255, 255, 255, ${star.alpha})`);
                gradient.addColorStop(0.5, `rgba(192, 132, 252, ${star.alpha * 0.5})`);
                gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

                ctx.strokeStyle = gradient;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(star.x, star.y);
                ctx.lineTo(tailX, tailY);
                ctx.stroke();

                // Update Position
                star.x += Math.cos(star.angle) * star.speed;
                star.y += Math.sin(star.angle) * star.speed;
                star.alpha -= 0.015;

                // Remove finished stars
                if (star.alpha <= 0 || star.x > width || star.y > height) {
                    shootingStars.splice(i, 1);
                }
            }

            requestAnimationFrame(draw);
        }

        draw();

        // Interactive Heart Toggle & Play Toggle
        document.querySelectorAll('.btn-icon').forEach(button => {
            button.addEventListener('click', function(e) {
                if (this.querySelector('.fa-heart')) {
                    this.classList.toggle('active');
                } else if (this.classList.contains('btn-play')) {
                    const icon = this.querySelector('i');
                    if (icon.classList.contains('fa-play')) {
                        icon.classList.remove('fa-play');
                        icon.classList.add('fa-pause');
                    } else {
                        icon.classList.remove('fa-pause');
                        icon.classList.add('fa-play');
                    }
                }
            });
        });
    </script>
